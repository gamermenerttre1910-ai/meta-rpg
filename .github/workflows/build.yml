name: apk
on:
  workflow_dispatch:
  push:

jobs:
  export-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android Debug Keystore
        run: |
          mkdir -p ~/.config/godot
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable/* ~/.local/share/godot/export_templates/4.3.stable/ || true
          
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.config/godot/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          
          echo '[settings]' > ~/.config/godot/editor_settings-4.godot
          echo "export/android/android_sdk_path = \"/usr/lib/android-sdk\"" >> ~/.config/godot/editor_settings-4.godot
          echo "export/android/debug_keystore = \"$HOME/.config/godot/debug.keystore\"" >> ~/.config/godot/editor_settings-4.godot
          echo 'export/android/debug_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.godot
          echo 'export/android/debug_password = "android"' >> ~/.config/godot/editor_settings-4.godot

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android Debug" build/meta-rpg.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-rpg-apk
          path: build/meta-rpg.apk
concurrency: 
