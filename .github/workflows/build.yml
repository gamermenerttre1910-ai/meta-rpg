name: apk
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Generate Key & Setup Godot Editor Settings
        run: |
          mkdir -p /root/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore /root/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          echo '[settings]' > /root/.config/godot/editor_settings-4.godot
          echo 'export/android/android_sdk_path = "/root/android-sdk"' >> /root/.config/godot/editor_settings-4.godot
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> /root/.config/godot/editor_settings-4.godot
          echo 'export/android/debug_user = "androiddebugkey"' >> /root/.config/godot/editor_settings-4.godot
          echo 'export/android/debug_password = "android"' >> /root/.config/godot/editor_settings-4.godot

      - name: Build Android APK
        run: |
          export HOME=/root
          mkdir -p build
          godot --headless --verbose --export-debug "Android Debug" build/meta-rpg.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-rpg-apk
          path: build/meta-rpg.apk
