name: apk
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Standard Godot 4.3
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Debug Keystore & Godot Settings
        run: |
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.config/godot/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          echo '[settings]' > ~/.config/godot/editor_settings-4.godot
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> ~/.config/godot/editor_settings-4.godot
          echo "export/android/debug_keystore = \"$HOME/.config/godot/debug.keystore\"" >> ~/.config/godot/editor_settings-4.godot
          echo 'export/android/debug_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.godot
          echo 'export/android/debug_password = "android"' >> ~/.config/godot/editor_settings-4.godot

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android Debug" build/meta-rpg.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-rpg-apk
          path: build/meta-rpg.apk
