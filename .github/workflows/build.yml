name: apk
on:
  workflow_dispatch:
  push:

jobs:
  export-apk:
    runs-on: ubuntu-latest
    name: Export Android APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.config/godot
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.config/godot/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Start ADB Server
        run: |
          $ANDROID_SDK_ROOT/platform-tools/adb start-server

      - name: Export Godot Android APK
        uses: firebelley/godot-export@v6.0.0
        env:
          GODOT_ANDROID_SDK_PATH: ${{ env.ANDROID_SDK_ROOT }}
          GODOT_ANDROID_DEBUG_KEYSTORE: /home/runner/.config/godot/debug.keystore
          GODOT_ANDROID_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: "true"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-rpg-apk
          path: build/meta-rpg.apk
